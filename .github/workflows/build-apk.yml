name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Offline JS Libraries into Android Assets
        run: |
          cd app/src/main/assets
          curl -sSL https://cdn.tailwindcss.com/3.4.17 -o tailwind.min.js
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o three.min.js
          curl -sSL https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js -o OrbitControls.js
          sed -i 's|https://cdn.tailwindcss.com/3.4.17|tailwind.min.js|g' index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|three.min.js|g' index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js|OrbitControls.js|g' index.html
          sed -i '/fonts.googleapis.com/d' index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketCAD-3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
